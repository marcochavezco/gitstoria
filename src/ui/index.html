<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gitstoria</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; overflow: hidden; }
      body { background: #0d0d0d; color: #c0c0c0; font-family: 'Courier New', Courier, monospace; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #0d0d0d; }
      ::-webkit-scrollbar-thumb { background: #2a2a2a; }
      .md h1, .md h2, .md h3 { color: #e0e0e0; margin: 12px 0 6px; }
      .md p { margin-bottom: 8px; line-height: 1.6; }
      .md code { background: #1a1a1a; padding: 1px 4px; border: 1px solid #2a2a2a; font-family: 'Courier New', monospace; font-size: 12px; }
      .md pre { background: #111; border: 1px solid #2a2a2a; padding: 10px; margin: 8px 0; overflow-x: auto; }
      .md pre code { background: none; border: none; padding: 0; }
      .md ul, .md ol { margin-left: 20px; margin-bottom: 8px; }
      .md li { margin-bottom: 4px; }
      .md strong { color: #e0e0e0; }
      .md a { color: #888; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
